<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F5F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="记一笔" />
  <title>记一笔 · 极简记账</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
</head>
<body>
  <!-- 侧边导航（iPad / 桌面） -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="brand__logo">记</div>
      <div class="brand__name">记一笔</div>
    </div>

    <nav class="sidebar__nav" id="sidebarNav"></nav>

    <div class="sidebar__foot">
      <div class="sidebar__sync" id="syncStatus">
        <span class="sync__dot"></span>
        <span class="sync__text">本地存储</span>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="shell">
    <header class="topbar">
      <div class="topbar__title" id="pageTitle">概览</div>
      <div class="topbar__actions">
        <button class="icon-btn" id="themeToggle" title="切换深浅色" aria-label="切换深浅色">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view" aria-live="polite"></main>
  </div>

  <!-- 底部导航（手机） -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- 悬浮快速记账按钮 -->
  <button class="fab" id="fab" aria-label="记一笔">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- 弹层容器 -->
  <div class="modal-root" id="modalRoot" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
